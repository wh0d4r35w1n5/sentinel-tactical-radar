server {
  server_name 54-66-217-111.sslip.io;
  root /opt/sentinel;
  index index.html;
  location /sentinel-tactical-radar/ { alias /opt/sentinel/; autoindex off; }
  # never let a stale page or artifact decide what the dashboard shows
  location = /index.html { add_header Cache-Control 'no-cache, must-revalidate';
  add_header Strict-Transport-Security 'max-age=31536000; includeSubDomains' always;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy no-referrer always;
  }
  # TradingView / dashboard webhook intake — operator setups via alert POST.
  # Auth = shared secret in the JSON body (state/tv-hook.json); nginx only
  # terminates TLS, caps body size, and forwards to the localhost receiver.
  location = /tv-hook {
    client_max_body_size 16k;
    proxy_pass http://127.0.0.1:8790;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }
  location /api/ { add_header Cache-Control 'no-cache, must-revalidate';
  add_header Strict-Transport-Security 'max-age=31536000; includeSubDomains' always;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy no-referrer always;
  }

  # === lockdown: web root is the app dir — only dashboard assets are public ===
  location ~ /\.(?!well-known) { return 404; }
  location ~ ^/(state|scripts|purge-|node_modules|logs|purge-) { return 404; }
  location ~ \.(env|session|session-journal|log|tgz|tar|zip|jsonl|bak|old|pem|key|conf|sh|py|mjs)$ { return 404; }

  # HSTS — browser remembers: https-only for a year
  add_header Strict-Transport-Security 'max-age=31536000; includeSubDomains' always;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy no-referrer always;

  location / { try_files $uri $uri/ /index.html; }

  listen 443 ssl; # managed by Certbot
  ssl_certificate /etc/letsencrypt/live/54-66-217-111.sslip.io/fullchain.pem; # managed by Certbot
  ssl_certificate_key /etc/letsencrypt/live/54-66-217-111.sslip.io/privkey.pem; # managed by Certbot
  include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
  ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
  ssl_stapling on;
  ssl_stapling_verify on;
  ssl_trusted_certificate /etc/letsencrypt/live/54-66-217-111.sslip.io/chain.pem;
  resolver 1.1.1.1 8.8.8.8 valid=300s;
}
server {
    if ($host = 54-66-217-111.sslip.io) {
        return 301 https://$host$request_uri;
    } # managed by Certbot
  listen 80 default_server;
  server_name 54-66-217-111.sslip.io;
    return 404; # managed by Certbot
}
