name: Refresh API snapshots

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - 'api/**'

permissions:
  contents: write

concurrency:
  group: refresh-api
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build scanner snapshot from Bitget
        run: node scripts/build-scanner.mjs
        env:
          COINGLASS_API_KEY: ${{ secrets.COINGLASS_API_KEY }}
          LUNARCRUSH_API_KEY: ${{ secrets.LUNARCRUSH_API_KEY }}
          CRYPTOPANIC_API_KEY: ${{ secrets.CRYPTOPANIC_API_KEY }}
          CMC_API_KEY: ${{ secrets.CMC_API_KEY }}
          COINMARKETCAL_CLIENT_ID: ${{ secrets.COINMARKETCAL_CLIENT_ID }}
          COINMARKETCAL_CLIENT_SECRET: ${{ secrets.COINMARKETCAL_CLIENT_SECRET }}

      # Executor runs AFTER the scanner so live-plan.json is fresh.
      # SENTINEL_EXEC=shadow (repo var) writes intended orders only — no keys
      # needed. demo/live require the BITGET_* secrets + the live arming pair.
      - name: Route live plan (shadow/demo/live per config)
        run: node scripts/bitget-exec.mjs
        env:
          SENTINEL_EXEC: ${{ vars.SENTINEL_EXEC || 'shadow' }}
          BITGET_API_KEY: ${{ secrets.BITGET_API_KEY }}
          BITGET_API_SECRET: ${{ secrets.BITGET_API_SECRET }}
          BITGET_PASSPHRASE: ${{ secrets.BITGET_PASSPHRASE }}
          BITGET_DEMO_API_KEY: ${{ secrets.BITGET_DEMO_API_KEY }}
          BITGET_DEMO_API_SECRET: ${{ secrets.BITGET_DEMO_API_SECRET }}
          BITGET_DEMO_PASSPHRASE: ${{ secrets.BITGET_DEMO_PASSPHRASE }}
          SENTINEL_LIVE: ${{ vars.SENTINEL_LIVE }}
          CONFIRM_LIVE: ${{ vars.CONFIRM_LIVE }}
          LIVE_MAX_NOTIONAL_USD: ${{ vars.LIVE_MAX_NOTIONAL_USD }}
          LIVE_MAX_POSITIONS: ${{ vars.LIVE_MAX_POSITIONS }}
        continue-on-error: true # an exec failure must never block the snapshot commit

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "chore: refresh api snapshots"
            # a queued run can land its commit while another was pushing —
            # rebase onto whatever the remote gained, then push once more
            git pull --rebase && git push
          fi
