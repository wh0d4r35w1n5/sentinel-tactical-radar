name: Refresh API snapshots

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - 'api/**'

permissions:
  contents: write

concurrency:
  group: refresh-api
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Pull upstream state snapshots
        run: |
          set -u
          origin="https://sentinel-tactical-radar-staging.netlify.app/api"
          for ep in config hud-status trades bot-state recovered-notes; do
            if curl -sf --retry 2 --retry-delay 3 --max-time 30 "$origin/$ep" -o "api/$ep.json.new"; then
              mv "api/$ep.json.new" "api/$ep.json"
              echo "updated $ep"
            else
              rm -f "api/$ep.json.new"
              echo "skipped $ep (origin unreachable)"
            fi
          done

      - name: Build scanner snapshot from Bitget
        run: node scripts/build-scanner.mjs

      - name: Build market snapshot (Jupiter + Solana + Bitget)
        run: node scripts/build-snapshot.mjs

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "chore: refresh api snapshots"
            git push
          fi
